<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title class="center-logo">
      <img src="assets/images/logo_2.png" alt="Logo" class="logo-img">
    </ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="!isLoggedIn" (click)="goToLogin()">Login</ion-button>
      <ion-button *ngIf="isLoggedIn" (click)="logout()">Logout</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Info Text -->
  <div class="ion-text-center ion-margin-bottom">
    <ion-text color="medium">
      Swipe a post to delete it
    </ion-text>
  </div>

  <!-- Posts -->
  <ion-list *ngIf="myPosts.length > 0">
    <ion-item-sliding *ngFor="let post of myPosts">
      <ion-item lines="none">
        <ion-card class="custom-card">
          <ion-card-content>
            <p><strong>Days:</strong> {{ post.availableDays?.join(', ') }}</p>
            <p><strong>Time:</strong> {{ post.availableTimeStart }} – {{ post.availableTimeEnd }}</p>
            <p><strong>Area:</strong> {{ post.area }}</p>
            <p *ngIf="post.description"><strong>Notes:</strong> {{ post.description }}</p>
          </ion-card-content>
        </ion-card>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="confirmDelete(post.id)">
          Delete
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <!-- No Posts Message -->
  <div *ngIf="myPosts.length === 0" class="ion-text-center">
    <p>No posts yet</p>
  </div>
</ion-content>
